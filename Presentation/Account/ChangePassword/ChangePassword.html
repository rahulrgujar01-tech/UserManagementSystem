<div class="ciit-content-header">
  <div>
    <h4>Change Password</h4>
    <p>Apna login password yahan se update karein.</p>
  </div>
</div>

<form [formGroup]="changeForm" (ngSubmit)="submit()" style="max-width:420px;">

  <div class="mb-3">
    <label class="form-label">Old Password</label>
    <input type="password" class="form-control" formControlName="oldPassword" placeholder="Enter current password" />
  </div>

  <div class="mb-3">
    <label class="form-label">New Password</label>
    <input type="password" class="form-control" formControlName="newPassword" placeholder="Enter new password" />
  </div>

  <div class="mb-3">
    <label class="form-label">Confirm New Password</label>
    <input type="password" class="form-control" formControlName="confirmPassword" placeholder="Confirm new password" />
  </div>

  <div class="alert alert-danger py-2" *ngIf="errormessage">{{ errormessage }}</div>
  <div class="alert alert-success py-2" *ngIf="successmessage">{{ successmessage }}</div>

  <button type="submit" class="btn btn-success">Update Password</button>
</form>
